<!doctype html>
<html lang="ru" data-theme="noir">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- theme-color не умеет читать CSS-переменные: держим в синхроне с --surface темы вручную -->
<meta name="theme-color" content="#0b0b0b">
<title>Lovely Radio</title>
<link rel="stylesheet" href="tokens/base.css">
<link rel="stylesheet" href="tokens/theme-noir.css">
<link rel="stylesheet" href="styles/app.css">
<script type="module" src="src/main.js"></script>
</head>
<body>
<main class="app">
  <h1 class="app__title" id="worldName">Lovely Radio</h1>

  <section class="now" aria-live="polite">
    <div class="now__name" id="nowName">Станция не выбрана</div>
    <div class="now__meta" id="nowMeta">Нажми «Играть»</div>
    <div class="now__status" id="status">—</div>
  </section>

  <div class="controls">
    <button class="btn" id="prev" aria-label="Предыдущая станция">⏮</button>
    <button class="btn btn--primary" id="play">▶ Играть</button>
    <button class="btn" id="next" aria-label="Следующая станция">⏭</button>
  </div>

  <ul class="channels" id="channels"></ul>

  <pre class="debug-log" id="log" hidden></pre>
</main>

<!-- Один <audio> на всё приложение. playsinline и preload="none" — как в спайке. -->
<audio id="audio" preload="none" playsinline></audio>
</body>
</html>
